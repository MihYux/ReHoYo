name: Release desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: ReHoYo-Windows-x64
            files: release/*.exe
          - label: macOS x64
            os: macos-15-intel
            command: npm run dist:mac
            artifact: ReHoYo-macOS-x64
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum installers/* > installers/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installers/*
          body: |
            ## ReHoYo desktop installers

            - Windows x64: unsigned NSIS `.exe`
            - macOS Intel: unsigned `.dmg`

            > [!WARNING]
            > These preview installers are not code-signed. Windows SmartScreen or macOS Gatekeeper may require manual confirmation.
