name: Release desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.app }} for ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Sender Agent
            platform: Windows x64
            os: windows-latest
            directory: sender-agent
            command: npm run dist:win
            artifact: ReHoYo-Sender-Agent-Windows-x64
            files: sender-agent/release/*.exe
          - app: Sender Agent
            platform: macOS x64
            os: macos-15-intel
            directory: sender-agent
            command: npm run dist:mac:x64
            artifact: ReHoYo-Sender-Agent-macOS-x64
            files: sender-agent/release/*.dmg
          - app: Pet
            platform: Windows x64
            os: windows-latest
            directory: pet
            command: npm run dist:win
            artifact: ReHoYo-Pet-Windows-x64
            files: pet/release/*.exe
          - app: Pet
            platform: macOS x64
            os: macos-15-intel
            directory: pet
            command: npm run dist:mac:x64
            artifact: ReHoYo-Pet-macOS-x64
            files: pet/release/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.directory }}
      - run: ${{ matrix.command }}
        working-directory: ${{ matrix.directory }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum installers/* > installers/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installers/*
          body: |
            ## ReHoYo desktop installers

            Two independent applications are included:

            - ReHoYo Sender Agent for employees
            - ReHoYo Pet for players

            Each app has a Windows x64 NSIS installer and a macOS Intel DMG.

            > [!WARNING]
            > These preview installers are not code-signed. Windows SmartScreen or macOS Gatekeeper may require manual confirmation.
